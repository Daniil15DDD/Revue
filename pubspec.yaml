name: revue
description: "A review of everything you experience — save links, videos and screenshots; on-device AI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_gemma: 0.13.6
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  # 1.9.0 is Swift-Package-only on iOS, which makes `flutter build` abort on Macs without Xcode.
  receive_sharing_intent: 1.8.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Figtree # SIL OFL 1.1, see assets/fonts/OFL.txt
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
